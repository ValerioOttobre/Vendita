<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Il Perfetto Venditore</title>

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

<div class="wrap">

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <img src="decathlon-logo.png" alt="Decathlon" class="logo">
      <div class="titles">
        <h1>Il Perfetto Venditore</h1>
        <p class="subtitle">Chiedi ai Trainer</p>
      </div>
    </div>

    <button class="searchBtn" aria-label="Cerca">🔍</button>
  </header>

  <!-- SEARCH INPUT -->
  <input
    id="searchInput"
    class="searchHidden"
    type="search"
    placeholder="Cerca una sezione…"
  >

  <!-- CONTENT -->
  <main class="card">
<div class="grid" id="sectionsGrid">

  <button class="sectionBtn" data-name="assistenza"
    onclick="goTo('assistenza/assistenza.html')">
    🧰 Assistenza
  </button>

  <button class="sectionBtn" data-name="b2b club aziende"
    onclick="goTo('b2b/b2b.html')">
    🤝 B2B
  </button>

  <button class="sectionBtn" data-name="carta decathlon"
    onclick="goTo('carta-decathlon/carta-decathlon.html')">
    🎫 Carta Decathlon
  </button>

  <button class="sectionBtn" data-name="fatturazione"
    onclick="goTo('fatturazione/fatturazione.html')">
    🧾 Fatturazione
  </button>

  <button class="sectionBtn" data-name="garanzia assicurazione"
    onclick="goTo('garanzia-assicurazione/garanzia-assicurazione.html')">
    🛡️ Garanzia
  </button>

  <button class="sectionBtn" data-name="incasso cassa"
    onclick="goTo('incasso/incasso.html')">
    🏧 Incasso
  </button>

  <button class="sectionBtn" data-name="intermag"
    onclick="goTo('intermag/intermag.html')">
    🚚 Intermag
  </button>

  <button class="sectionBtn" data-name="ordine plus"
    onclick="goTo('ordine-plus/ordine-plus.html')">
    📦 Ordine PLUS
  </button>

  <button class="sectionBtn" data-name="presentazione wow"
    onclick="goTo('presentazione-wow/presentazione-wow.html')">
    😁 Presentazione WOW
  </button>

  <button class="sectionBtn" data-name="second hand usato"
    onclick="goTo('second-hand/second-hand.html')">
    ♻️ Second Hand
  </button>

</div>
  </main>

  <footer>© Il Perfetto Venditore</footer>

</div>

<!-- SCRIPT -->
<script>
function goTo(page){
  window.location.href = page;
}

const searchBtn = document.querySelector(".searchBtn");
const searchInput = document.getElementById("searchInput");
const buttons = document.querySelectorAll(".sectionBtn");

searchBtn.addEventListener("click", () => {
  const hidden = searchInput.classList.toggle("searchHidden");
  searchBtn.textContent = hidden ? "🔍" : "❌";
  if (!hidden) searchInput.focus();
});

searchInput.addEventListener("input", () => {
  const q = searchInput.value.toLowerCase();
  buttons.forEach(btn => {
    const text = (btn.dataset.name + btn.innerText).toLowerCase();
    btn.style.display = text.includes(q) ? "" : "none";
  });
});
</script>

</body>
</html>
