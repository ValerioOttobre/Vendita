<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formazioni Vendita - Hub</title>

  <style>
    :root{
      /* Palette più vicina a Decathlon */
      --decathlon-blue:#0070c9;      /* blu brand */
      --decathlon-blue-dark:#0057a8; /* hover/pressione */
      --decathlon-accent:#00a6ff;    /* accento chiaro */
      --ring: rgba(0,112,201,.25);

      --bg:#f2f7ff;        /* sfondo leggermente blu */
      --card:#ffffff;
      --text:#0b1220;
      --muted:#52617a;

      --shadow:0 10px 30px rgba(11,18,32,.08);
      --radius:16px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 55%, #ffffff 100%);
      color: var(--text);
    }

    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 16px 36px;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 16px 18px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(2,6,23,.06);
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 12px;
      min-width: 240px;
    }

    .logoBox{
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background: transparent;
    }
    .logoBox img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display:block;
    }

    h1{
      margin:0;
      font-size: 17px;
      line-height: 1.2;
    }
    .subtitle{
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }

    .search{
      flex:1;
      display:flex;
      justify-content:flex-end;
    }

    .search input{
      width: min(420px, 100%);
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(2,6,23,.12);
      outline:none;
      box-shadow: 0 0 0 0 var(--ring);
      transition: box-shadow .15s ease, border-color .15s ease;
      font-size: 14px;
    }
    .search input:focus{
      border-color: rgba(0,112,201,.55);
      box-shadow: 0 0 0 4px var(--ring);
    }

    /* MAIN: una colonna (note rimosse) */
    main{
      margin-top: 18px;
      display:block;
    }

    .card{
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(2,6,23,.06);
      padding: 16px;
    }

    .gridTitle{
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 900;
      color: var(--text);
      letter-spacing: .2px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }
    @media (max-width: 520px){
      .grid{ grid-template-columns: 1fr; }
    }

    .sectionBtn{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      width:100%;
      text-align:left;

      padding: 14px 16px;
      border-radius: 16px;

      background: var(--decathlon-blue);
      color:#fff;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 12px 24px rgba(0,112,201,.18);

      transition: transform .08s ease, filter .15s ease, box-shadow .15s ease, background .15s ease;
      cursor:pointer;
    }
    .sectionBtn:hover{
      filter: brightness(1.04);
      background: var(--decathlon-blue-dark);
      box-shadow: 0 14px 28px rgba(0,112,201,.22);
    }
    .sectionBtn:active{ transform: translateY(1px); }

    .left{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
    }
    .emoji{ font-size: 19px; }
    .label{
      font-weight: 900;
      font-size: 15px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .arrow{
      opacity:.95;
      font-weight: 900;
      font-size: 18px;
    }

    .tipTitle{
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: .2px;
      color: var(--muted);
      font-weight: 800;
      text-transform: uppercase;
    }

    .tipBox{
      border-radius: 14px;
      padding: 12px 12px;
      border: 1px solid rgba(0,112,201,.16);
      background: linear-gradient(180deg, rgba(0,166,255,.08), rgba(0,112,201,.06));
    }

    .tipText{
      margin: 0 0 10px;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 650;
      color: var(--text);
    }

    .btnRow{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn{
      appearance:none;
      border:none;
      cursor:pointer;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      transition: transform .08s ease, filter .15s ease;
      user-select:none;
    }
    .btn:active{ transform: translateY(1px); }

    .btnSoft{
      background: rgba(0,112,201,.10);
      color: var(--decathlon-blue-dark);
      border: 1px solid rgba(0,112,201,.20);
    }
    .btnSoft:hover{ filter: brightness(1.03); }

    footer{
      margin-top: 14px;
      text-align:center;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logoBox" aria-label="Decathlon">
          <img src="decathlon-logo.png" alt="Decathlon" />
        </div>
        <div>
          <h1>Formazioni Vendita</h1>
          <p class="subtitle">Hub rapido per tips, strumenti e procedure</p>
        </div>
      </div>

      <div class="search">
        <input id="searchInput" type="search" placeholder="Cerca una sezione (es. garanzia, incasso…)" />
      </div>
    </header>

    <main>
      <section class="card">
        <div class="gridTitle">Sezioni</div>

        <div class="grid" id="sectionsGrid">
          <button class="sectionBtn" data-name="presentazione wow" onclick="goTo('presentazione-wow.html')">
            <span class="left"><span class="emoji">🎤</span><span class="label">Presentazione WOW</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="carta decathlon" onclick="goTo('carta-decathlon.html')">
            <span class="left"><span class="emoji">💳</span><span class="label">Carta Decathlon</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="second hand" onclick="goTo('second-hand.html')">
            <span class="left"><span class="emoji">♻️</span><span class="label">Second Hand</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="garanzia e assicurazione garanzia assicurazione" onclick="goTo('garanzia-assicurazione.html')">
            <span class="left"><span class="emoji">🛡️</span><span class="label">Garanzia e Assicurazione</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="fatturazione fatture" onclick="goTo('fatturazione.html')">
            <span class="left"><span class="emoji">🧾</span><span class="label">Fatturazione</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="ordine plus plus" onclick="goTo('ordine-plus.html')">
            <span class="left"><span class="emoji">➕</span><span class="label">Ordine PLUS</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="intermag" onclick="goTo('intermag.html')">
            <span class="left"><span class="emoji">🧭</span><span class="label">Intermag</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="b2b" onclick="goTo('b2b.html')">
            <span class="left"><span class="emoji">🏢</span><span class="label">B2B</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="incasso cassa" onclick="goTo('incasso.html')">
            <span class="left"><span class="emoji">💰</span><span class="label">Incasso</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="assistenza aiuto" onclick="goTo('assistenza.html')">
            <span class="left"><span class="emoji">🧰</span><span class="label">Assistenza</span></span>
            <span class="arrow">›</span>
          </button>
        </div>

        <div class="tipTitle">Tip della settimana</div>
        <div class="tipBox">
          <p class="tipText" id="tipText">Caricamento tip…</p>
          <div class="btnRow">
            <button class="btn btnSoft" id="changeTipBtn">Cambia tip</button>
          </div>
        </div>
      </section>
    </main>

    <footer>
      © Hub Formazioni Vendita — versione GitHub Pages
    </footer>
  </div>

  <script>
    // Tip della settimana
    const tips = [
      "Fai 1 domanda in più: spesso è lì che nasce la vendita (bisogno reale).",
      "Quando proponi un servizio, aggancialo a un problema concreto del cliente.",
      "Ricapitola in 10 secondi: 'Quindi ti serve X per Y, giusto?'.",
      "Mostra 2 opzioni: una 'base' e una 'migliore' (aiuta la scelta).",
      "Se il cliente è indeciso, prova: 'Cosa ti serve assolutamente che faccia?'.",
      "Prima di chiudere: verifica taglia/uso/compatibilità (riduce resi).",
      "Usa esempi reali: 'Di solito chi fa X sceglie anche Y'.",
      "Mantieni il ritmo: una domanda, una risposta, un passo avanti.",
      "Parla di benefici, non caratteristiche: 'ti fa risparmiare tempo' > 'ha 3 funzioni'.",
      "Chiudi con serenità: 'Se vuoi, ti preparo io la soluzione più semplice'."
    ];

    const tipText = document.getElementById("tipText");
    const changeTipBtn = document.getElementById("changeTipBtn");

    function pickRandomTip(){
      const i = Math.floor(Math.random() * tips.length);
      tipText.textContent = tips[i];
    }
    pickRandomTip();
    changeTipBtn.addEventListener("click", pickRandomTip);

    // Navigazione
    function goTo(page){
      window.location.href = page;
    }
    window.goTo = goTo;

    // Ricerca sezioni (filtra i 10 tasti)
    const searchInput = document.getElementById("searchInput");
    const grid = document.getElementById("sectionsGrid");
    const buttons = Array.from(grid.querySelectorAll("button.sectionBtn"));

    function normalize(s){
      return (s || "").toLowerCase().trim();
    }

    function filterSections(){
      const q = normalize(searchInput.value);
      buttons.forEach(btn => {
        const name = normalize(btn.getAttribute("data-name"));
        const label = normalize(btn.innerText);
        const ok = !q || name.includes(q) || label.includes(q);
        btn.style.display = ok ? "" : "none";
      });
    }

    searchInput.addEventListener("input", filterSections);
  </script>
</body>
</html>
