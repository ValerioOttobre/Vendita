<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Il Perfetto Venditore</title>

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

<div class="wrap">

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <img src="decathlon-logo.png" alt="Decathlon" class="logo">
      <div class="titles">
        <h1>Il Perfetto Venditore</h1>
        <p class="subtitle">Chiedi ai Trainer</p>
      </div>
    </div>

    <button class="searchBtn" aria-label="Cerca">🔍</button>
  </header>

  <!-- SEARCH INPUT -->
  <input
    id="searchInput"
    class="searchHidden"
    type="search"
    placeholder="Cerca una sezione…"
  >

<!-- CONTENT -->
<main class="card">
<div class="grid" id="sectionsGrid">

<button class="sectionBtn" data-name="aiutaci migliorare feedback suggerimenti sito"
onclick="goTo('aiutaci-a-migliorare/aiutaci-a-migliorare.html')">
😁 Aiutaci a Migliorare!
</button>
  
<button class="sectionBtn" data-name="b2b club aziende tessera associazioni carta club"
onclick="goTo('b2b/b2b.html')">
🤝 B2B
</button>

<button class="sectionBtn" data-name="second hand usato riacquisto vendita usato reso usato"
onclick="goTo('second-hand/second-hand.html')">
♻️ Second Hand
</button>

  <button class="sectionBtn" data-name="assistenza riparazione laboratorio prodotto rotto"
onclick="goTo('assistenza/assistenza.html')">
🧰 Assistenza
</button>

<button class="sectionBtn" data-name="carta decathlon reso buono cliente rimborso"
onclick="goTo('carta-decathlon/carta-decathlon.html')">
🎫 Carta Decathlon
</button>

<button class="sectionBtn" data-name="fatturazione fattura partita iva azienda documento"
onclick="goTo('fatturazione/fatturazione.html')">
🧾 Fatturazione
</button>

<button class="sectionBtn" data-name="garanzia assicurazione protezione prodotto danno"
onclick="goTo('garanzia-assicurazione/garanzia-assicurazione.html')">
🛡️ Garanzia e Assicurazione
</button>

<button class="sectionBtn" data-name="incasso cassa pagamento contanti carta pagamento"
onclick="goTo('incasso/incasso.html')">
🏧 Incasso
</button>

<button class="sectionBtn" data-name="intermag trasferimento magazzino negozio prodotto"
onclick="goTo('intermag/intermag.html')">
🚚 Intermag
</button>

<button class="sectionBtn" data-name="ordine plus ordine cliente prodotto spedizione"
onclick="goTo('ordine-plus/ordine-plus.html')">
📦 Ordine PLUS
</button>

</div>
  </main>

  <footer>© Il Perfetto Venditore</footer>

</div>

<!-- SCRIPT -->
<script>
function goTo(page){
  window.location.href = page;
}

const searchBtn = document.querySelector(".searchBtn");
const searchInput = document.getElementById("searchInput");
const buttons = document.querySelectorAll(".sectionBtn");

searchBtn.addEventListener("click", () => {
  const hidden = searchInput.classList.toggle("searchHidden");
  searchBtn.textContent = hidden ? "🔍" : "❌";
  if (!hidden) searchInput.focus();
});

searchInput.addEventListener("input", () => {
  const q = searchInput.value.toLowerCase();
  buttons.forEach(btn => {
    const text = (btn.dataset.name + btn.innerText).toLowerCase();
    btn.style.display = text.includes(q) ? "" : "none";
  });
});
</script>

</body>
</html>
