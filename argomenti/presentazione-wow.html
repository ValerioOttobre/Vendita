<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Presentazione WOW</title>

  <style>
    :root{--bg:#0b1220;--card:#111a2e;--text:#eaf0ff;--muted:#aab6d6;--border:rgba(255,255,255,.10);
      --shadow:0 10px 24px rgba(0,0,0,.35);--radius:16px;--btn:#1a2642;--btnHover:#223357;}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:radial-gradient(1200px 600px at 20% 0%,rgba(61,220,151,.14),transparent 50%),
               radial-gradient(900px 500px at 95% 20%,rgba(87,140,255,.18),transparent 55%),var(--bg);
      color:var(--text);}
    header,main{max-width:980px;margin:0 auto;padding:16px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.03);
      border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
    .title{display:flex;align-items:center;gap:10px}
    .icon{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:rgba(61,220,151,.15);
      border:1px solid rgba(61,220,151,.18);font-size:18px;}
    h1{margin:0;font-size:16px}
    .sub{margin:4px 0 0;color:var(--muted);font-size:12px}
    .back{text-decoration:none;color:var(--text);background:var(--btn);border:1px solid var(--border);
      border-radius:12px;padding:8px 12px;font-size:12px}
    .back:hover{background:var(--btnHover)}
    .grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}
    @media (min-width:600px){.grid{grid-template-columns:1fr 1fr}}
    .tip{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;
      box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
    .num{width:32px;height:32px;border-radius:10px;background:rgba(61,220,151,.18);border:1px solid rgba(61,220,151,.25);
      display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto}
    .text{color:var(--muted);font-size:13px}
  </style>
</head>
<body>
<header>
  <div class="top">
    <div class="title">
      <div class="icon">✨</div>
      <div>
        <h1>Presentazione WOW</h1>
        <div class="sub">10 tips utili per la vendita</div>
      </div>
    </div>
    <a class="back" href="../index.html">← Home</a>
  </div>
</header>
<main>
  <div class="grid">
    <div class="tip"><div class="num">1</div><div class="text">Tip 1</div></div>
    <div class="tip"><div class="num">2</div><div class="text">Tip 2</div></div>
    <div class="tip"><div class="num">3</div><div class="text">Tip 3</div></div>
    <div class="tip"><div class="num">4</div><div class="text">Tip 4</div></div>
    <div class="tip"><div class="num">5</div><div class="text">Tip 5</div></div>
    <div class="tip"><div class="num">6</div><div class="text">Tip 6</div></div>
    <div class="tip"><div class="num">7</div><div class="text">Tip 7</div></div>
    <div class="tip"><div class="num">8</div><div class="text">Tip 8</div></div>
    <div class="tip"><div class="num">9</div><div class="text">Tip 9</div></div>
    <div class="tip"><div class="num">10</div><div class="text">Tip 10</div></div>
  </div>
</main>
</body>
</html>
