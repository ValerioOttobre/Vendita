<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formazioni Vendita - Hub</title>

  <style>
    :root{
      /* Colori (blu preso dal tuo logo) */
      --decathlon-blue:#212A9A;
      --decathlon-blue-dark:#1b227f;  /* più scuro per bordi/contrasto */
      --decathlon-accent:#3a46d1;     /* accento leggero */

      --ring: rgba(33,42,154,.26);

      --bg:#f1f3ff;
      --card:#ffffff;
      --text:#0b1220;
      --muted:#4f5b78;

      --shadow:0 10px 30px rgba(11,18,32,.08);
      --radius:16px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 55%, #ffffff 100%);
      color: var(--text);
    }

    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 16px 36px;
    }

    header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      padding: 16px 18px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(2,6,23,.06);
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 12px;
      min-width: 240px;
    }

    .logoBox{
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background: transparent;
      flex: 0 0 auto;
    }
    .logoBox img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display:block;
    }

    h1{
      margin:0;
      font-size: 17px;
      line-height: 1.2;
    }
    .subtitle{
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }

    .search{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
    }

    .searchLabel{
      width: min(420px, 100%);
      display:flex;
      align-items:center;
      gap: 8px;
      margin: 0 0 6px;
      color: rgba(11,18,32,.58);
      font-weight: 800;
      font-size: 12px;
      letter-spacing: .2px;
      user-select: none;
    }

    .searchIcon{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      color: rgba(11,18,32,.55);
    }

    .search input{
      width: min(420px, 100%);
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(2,6,23,.14);
      outline:none;
      box-shadow: 0 0 0 0 var(--ring);
      transition: box-shadow .15s ease, border-color .15s ease;
      font-size: 14px;
      background: #fff;
    }
    .search input:focus{
      border-color: rgba(33,42,154,.55);
      box-shadow: 0 0 0 4px var(--ring);
    }

    @media (max-width: 860px){
      header{
        flex-direction:column;
        align-items:stretch;
      }
      .brand{ min-width:auto; }
      .search{
        align-items:stretch;
      }
      .searchLabel,
      .search input{
        width: 100%;
        max-width: 520px;
      }
    }

    main{
      margin-top: 18px;
      display:block;
    }

    .card{
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(2,6,23,.06);
      padding: 16px;
    }

    .gridTitle{
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 900;
      color: var(--text);
      letter-spacing: .2px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }
    @media (max-width: 520px){
      .grid{ grid-template-columns: 1fr; }
    }

    .sectionBtn{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      width:100%;
      text-align:left;

      padding: 14px 16px;
      border-radius: 16px;

      background: var(--decathlon-blue);
      color:#fff;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 12px 24px rgba(33,42,154,.16);

      cursor:pointer;
      user-select:none;
    }

    /* Mobile-first: niente hover (su telefono è inutile). */
    .sectionBtn:active{
      transform: translateY(1px);
      background: var(--decathlon-blue-dark);
    }

    .left{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
    }
    .emoji{ font-size: 19px; }
    .label{
      font-weight: 900;
      font-size: 15px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .arrow{
      opacity:.95;
      font-weight: 900;
      font-size: 18px;
    }

    .tipTitle{
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: .2px;
      color: var(--muted);
      font-weight: 800;
      text-transform: uppercase;
    }

    .tipBox{
      border-radius: 14px;
      padding: 12px 12px;
      border: 1px solid rgba(33,42,154,.14);
      background: linear-gradient(180deg, rgba(58,70,209,.10), rgba(33,42,154,.06));
    }

    .tipText{
      margin: 0 0 10px;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 650;
      color: var(--text);
    }

    .btnRow{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn{
      appearance:none;
      border:none;
      cursor:pointer;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      transition: transform .08s ease, filter .15s ease;
      user-select:none;
    }
    .btn:active{ transform: translateY(1px); }

    .btnSoft{
      background: rgba(33,42,154,.10);
      color: var(--decathlon-blue-dark);
      border: 1px solid rgba(33,42,154,.20);
    }
    .btnSoft:active{ filter: brightness(0.98); }

    footer{
      margin-top: 14px;
      text-align:center;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logoBox" aria-label="Decathlon">
          <img src="decathlon-logo.png" alt="Decathlon" />
        </div>
        <div>
          <h1>Il Perfetto Venditore</h1>
          <p class="subtitle">Chiedi ai Trainer</p>
        </div>
      </div>

      <div class="search">
        <div class="searchLabel" aria-hidden="true">
          <span class="searchIcon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
              <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2"/>
              <path d="M16.3 16.3 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="searchLabelText">Cerca</span>
        </div>

        <input id="searchInput" type="search" placeholder="Cerca una sezione (es. garanzia, incasso…)" />
      </div>
    </header>

    <main>
      <section class="card">
        <div class="gridTitle">Sezioni</div>

        <div class="grid" id="sectionsGrid">
          <!-- Ordine come richiesto -->
          <button class="sectionBtn" data-name="presentazione wow" onclick="goTo('presentazione-wow.html')">
            <span class="left"><span class="emoji">😁</span><span class="label">Presentazione WOW</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="carta decathlon carta fedelta fidelity" onclick="goTo('carta-decathlon.html')">
            <span class="left"><span class="emoji">🎫</span><span class="label">Carta Decathlon</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="ordine plus ordine online carrello" onclick="goTo('ordine-plus.html')">
            <span class="left"><span class="emoji">📦</span><span class="label">Ordine PLUS</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="intermag consegna magazzino camion" onclick="goTo('intermag.html')">
            <span class="left"><span class="emoji">🚚</span><span class="label">Intermag</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="fatturazione fatture" onclick="goTo('fatturazione.html')">
            <span class="left"><span class="emoji">🧾</span><span class="label">Fatturazione</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="b2b aziende business accordi" onclick="goTo('b2b.html')">
            <span class="left"><span class="emoji">🤝</span><span class="label">B2B</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="garanzia e assicurazione garanzia assicurazione" onclick="goTo('garanzia-assicurazione.html')">
            <span class="left"><span class="emoji">🛡️</span><span class="label">Garanzia e Assicurazione</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="incasso cassa pagamenti" onclick="goTo('incasso.html')">
            <span class="left"><span class="emoji">🏧</span><span class="label">Incasso</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="assistenza aiuto" onclick="goTo('assistenza.html')">
            <span class="left"><span class="emoji">🧰</span><span class="label">Assistenza</span></span>
            <span class="arrow">›</span>
          </button>

          <button class="sectionBtn" data-name="second hand usato reso" onclick="goTo('second-hand.html')">
            <span class="left"><span class="emoji">♻️</span><span class="label">Second Hand</span></span>
            <span class="arrow">›</span>
          </button>
        </div>

        <div class="tipTitle">Tip della settimana</div>
        <div class="tipBox">
          <p class="tipText" id="tipText">Caricamento tip…</p>
          <div class="btnRow">
            <button class="btn btnSoft" id="changeTipBtn">Cambia tip</button>
          </div>
        </div>
      </section>
    </main>

    <footer>
      © Hub Formazioni Vendita — versione GitHub Pages
    </footer>
  </div>

  <script>
    // Tip della settimana
    const tips = [
      "Lo sai che esista un'assicurazione generica valida per qualsiasi prodotto Decathlon eccetto tessile, calzature e i prodotti con assicurazioni dedicate (biciclette e macchinari fitness)?",
      "Lo sai che se un cliente possessore di carta Decathlon Club associa le tessere Decathlon dei suoi soci alla sua guadagna punti sugli acquisti dei suoi soci?",
      "Lo sai che se un articolo è disponibile in qualsiasi negozio Romano il cliente può averlo entro il giorno dopo nel negozio che preferisce?",
      "Lo sai che dal sito si possono fare carte regalo da 5€ fino a 500€?",
      "Il 40% della clientela che lascia il negozio senza comprare sarebbe potuta essere soddisfatta dall’Ordine Digitale In Store. La CA persa è stimata a circa il 10% della CA instore (esempio su Fiumicino circa 2 mln€).",
      "Non diciamo mai di NO al cliente e sfruttiamo le potenzialità della vendita omnicanale con l'ausilio di tutti gli strumenti a nostra disposizione: Kiosk, Moby, Palette RFID, ecc)",
      "Spesso le obiezioni sono il segnale di acquisto più forte. Impegniamoci a sfruttarle a nostro vantaggio per condurre una vendita efficace.",
      "Usa domande aperte per carpire più informazioni possibili dal cliente e domande chiuse per guidare la comunicazione, ottenere conferme e chiudere la vendita.",
      "Utilizza al meglio tutti i canali comunicativi ricordando che quello che dici (Verbale) impatta l'efficacia della tua comunicazione SOLO per il 7%. Il restante 93% dipende da quello che non dici (Paraverbale e Non Verbale).",
      "Un cliente soffisfatto parla bene di noi a 0 persone, un cliente entusiasta parla bene di noi a 3 persone, un cliente deluso parla male di noi a 7 persone."
    ];

    const tipText = document.getElementById("tipText");
    const changeTipBtn = document.getElementById("changeTipBtn");

    function pickRandomTip(){
      const i = Math.floor(Math.random() * tips.length);
      tipText.textContent = tips[i];
    }
    pickRandomTip();
    changeTipBtn.addEventListener("click", pickRandomTip);

    // Navigazione
    function goTo(page){
      window.location.href = page;
    }
    window.goTo = goTo;

    // Ricerca sezioni (filtra i 10 tasti)
    const searchInput = document.getElementById("searchInput");
    const grid = document.getElementById("sectionsGrid");
    const buttons = Array.from(grid.querySelectorAll("button.sectionBtn"));

    function normalize(s){
      return (s || "").toLowerCase().trim();
    }

    function filterSections(){
      const q = normalize(searchInput.value);
      buttons.forEach(btn => {
        const name = normalize(btn.getAttribute("data-name"));
        const label = normalize(btn.innerText);
        const ok = !q || name.includes(q) || label.includes(q);
        btn.style.display = ok ? "" : "none";
      });
    }

    searchInput.addEventListener("input", filterSections);
  </script>
</body>
</html>
