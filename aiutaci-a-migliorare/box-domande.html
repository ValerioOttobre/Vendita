<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B2B – Box Domande</title>

  <link rel="stylesheet" href="../assets/css/styles.css">

  <style>
    .questions-list {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    .question-item {
      background: #f8fafb;
      border: 1px solid #dde5ea;
      border-radius: 14px;
      padding: 16px;
    }

    .question-item h3 {
      margin: 0 0 8px;
      font-size: 1rem;
    }

    .question-meta {
      font-size: 0.88rem;
      color: #66707a;
      margin-bottom: 8px;
    }

    .empty-state {
      margin-top: 18px;
      padding: 18px;
      border-radius: 14px;
      background: #f8fafb;
      border: 1px dashed #ccd6dd;
      color: #5b6570;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .small-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      border: none;
      cursor: pointer;
      background: #0082c3;
      color: #fff;
    }

    .small-btn.secondary {
      background: #eef2f5;
      color: #1d1d1f;
    }
  </style>
</head>

<body>
<div class="wrap">

  <header class="header">
    <div class="brand">
      <img src="../decathlon-logo.png" alt="Decathlon" class="logo">
      <div class="titles">
        <h1>Box Domande</h1>
        <p class="subtitle">B2B</p>
      </div>
    </div>
    <span style="width:32px;"></span>
  </header>

  <main class="card">
    <div class="card-content">
      <p class="lead">
        In questa sezione sono raccolte le domande inserite dagli utilizzatori del sito.
      </p>

      <div class="top-actions">
        <a class="small-btn secondary" href="aiutaci-a-migliorare.html">Torna indietro</a>
        <button class="small-btn" id="clearQuestionsBtn">Svuota elenco</button>
      </div>

      <div id="questionsContainer" class="questions-list"></div>
    </div>
  </main>

</div>

<script>
  const questionsContainer = document.getElementById("questionsContainer");
  const clearQuestionsBtn = document.getElementById("clearQuestionsBtn");

  function renderQuestions() {
    const questions = JSON.parse(localStorage.getItem("boxDomande") || "[]");

    if (!questions.length) {
      questionsContainer.innerHTML = `
        <div class="empty-state">
          Non sono ancora presenti domande salvate.
        </div>
      `;
      return;
    }

    questionsContainer.innerHTML = questions.map((item, index) => `
      <div class="question-item">
        <h3>Domanda ${questions.length - index}</h3>
        <div class="question-meta">
          Inserita il: ${item.data}
        </div>
        <div>${item.testo}</div>
      </div>
    `).join("");
  }

  clearQuestionsBtn.addEventListener("click", () => {
    const conferma = confirm("Vuoi davvero svuotare l'elenco delle domande?");
    if (!conferma) return;

    localStorage.removeItem("boxDomande");
    renderQuestions();
  });

  renderQuestions();
</script>
</body>
</html>
